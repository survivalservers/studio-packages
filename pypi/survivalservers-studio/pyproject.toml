[project]
name = "survivalservers-studio"
version = "0.1.0"
description = "Typed client for the Survival Servers Studio API, for studio backends and matchmakers"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # What the generated code (openapi-python-client 0.29.1) needs.
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Repository = "https://github.com/survivalservers/studio-packages"

[dependency-groups]
test = ["pytest>=8"]

[tool.uv.build-backend]
module-name = "survivalservers_studio"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
