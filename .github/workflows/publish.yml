# Publishes the packages in this repository.
# - Runs only when a tag starting with "v" is pushed, and stops unless the tagged commit is on main.
# - Every publish job waits in the "publish" environment for a required reviewer to approve it.
# - No pull request runs and no manual runs.
# - No stored keys: each registry trusts this file, in this repository, in the "publish" environment.
# - A version already on a registry is skipped, so a tag only publishes what is new.
# - Every action is pinned to a full commit and every build tool to a hash. Builds make wheels only, so installing a
#   package runs nothing.
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Tag on main, no install-time code, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      npm: ${{ steps.npmpack.outputs.count }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Every action, nested ones included, is allowed
        run: python3 .github/scripts/check-actions.py

      - name: No install-time code in any package
        run: |
          set -eu
          bad=$(git ls-files | grep -E '(^|/)(setup\.py|setup\.cfg|build\.rs|binding\.gyp|install\.ps1)$|\.(targets|props)$' || true)
          if [ -n "$bad" ]; then echo "Not allowed in this repository: $bad"; exit 1; fi

      - name: Pack the npm packages that are not on npm yet (no scripts run)
        id: npmpack
        run: |
          set -eu
          mkdir -p dist/npm
          for d in npm/*/; do
            if [ -n "$(node -e 'const p=require("./'"$d"'package.json"); process.stdout.write(Object.keys(p.scripts||{}).join(","))')" ]; then
              echo "$d has scripts; not allowed"; exit 1
            fi
            spec=$(node -p 'const p=require("./'"$d"'package.json"); p.name+"@"+p.version')
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already on npm; skipped"; continue; fi
            npm pack "$d" --ignore-scripts --pack-destination dist/npm
          done
          echo "count=$(ls dist/npm | wc -l)" >> "$GITHUB_OUTPUT"
          ls dist/npm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: dist/npm/
          if-no-files-found: ignore

      - name: Build the Python packages (wheels only, build tools pinned by hash)
        run: |
          set -eu
          cat > "$RUNNER_TEMP/build-requirements.txt" <<'REQ'
          build==1.6.1 --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject_hooks==1.3.3 --hash=sha256:5fc53fdac9f7bd63fbcdc868fb5f90b4784d78a53a3d3388cd738b807441a20b
          flit_core==4.2.0 --hash=sha256:2bee22dc8ba89c2e35b4e1ad575e596aac945c85672dd8f3cad21b629036e044
          REQ
          python3 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/build-requirements.txt"
          for d in pypi/*/; do "$RUNNER_TEMP/build/bin/python" -m build --wheel --no-isolation --outdir dist/pypi "$d"; done

      - name: Install each wheel offline and try it
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/try"
          "$RUNNER_TEMP/try/bin/pip" install --no-deps --no-index dist/pypi/*.whl
          "$RUNNER_TEMP/try/bin/python" -c "from survivalservers_studio import docs_url; assert docs_url() == 'https://studio.survivalservers.com/docs/'"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi
          path: dist/pypi/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi
          path: dist/pypi/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi/
          skip-existing: true

  npm:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.npm != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/npm/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish with trusted publishing (no token)
        run: |
          set -eu
          shopt -s nullglob
          files=(dist/npm/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing new for npm"; exit 0; fi
          npm --version
          for f in "${files[@]}"; do npm publish "$f" --access public --ignore-scripts; done
