# Publishes the packages in this repository and makes the GitHub release that carries the release files.
# - Runs only when a tag starting with "v" is pushed, and stops unless the tagged commit is on main.
# - Every publish job waits in the "publish" environment for a required reviewer to approve it. All of them need only
#   the check job, so they wait at the same moment and one approval covers every registry in the run.
# - No pull request runs and no manual runs.
# - No stored keys: each registry trusts this file, in this repository, in the "publish" environment.
# - A version already on a registry is skipped, so a tag only publishes what is new.
# - Nothing a package runs when installed: no install scripts, no setup.py, no build.rs. Python builds make wheels
#   only, npm packs and publishes with scripts off and the packed package.json carries no scripts at all.
# - Every action is pinned to a full commit and every build tool to a hash.
# - Nothing goes out unless it is byte for byte a file that was scanned before it went public: the check job, each
#   publish job and the release job compare every file with the scanned lists (SHA256SUMS.scanned) and refuse any
#   file that differs or is on no list. A release never rebuilds to get past that.
# - The release job runs after the publish jobs succeed, outside the environment, with no id-token and no secrets:
#   it attaches every file the run made (the command-line tool's downloads and the package files) and SHA256SUMS.
# - The MCP Registry entry (go/mcp/server.json, the exact bytes sent) goes out only when its gate says go: the owner's
#   approval of those bytes (mcp-registry/approved.sha256) and the lead's go for one publication
#   (mcp-registry/publish-go) are both in the tagged commit. Without the go, the gate job says so and the registry job is skipped. The registry trusts this
#   workflow's id-token (GitHub OIDC), so no registry key is kept anywhere. mcp-publisher is pinned by version and
#   checksum. The registry job holds the id-token and contents: read, nothing else.
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Tag on main, no install-time code, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      npm: ${{ steps.build.outputs.npm }}
      pypi: ${{ steps.build.outputs.pypi }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Every action, nested ones included, is allowed
        run: python3 .github/scripts/check-actions.py

      - name: Build what is new (no install-time code; npm packed with no scripts; wheels only; the downloads)
        id: build
        run: .github/scripts/build.sh --release "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm
          path: dist/npm/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-first-by-hand
          path: dist/npm-first-by-hand/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pypi
          path: dist/pypi/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: dist/cli/
          if-no-files-found: ignore

  pypi:
    name: Publish to PyPI
    needs: check
    if: needs.check.outputs.pypi != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pypi
          path: dist/pypi/

      - name: Every file is byte for byte a scanned file
        run: python3 -I .github/scripts/match-scanned.py --release dist/pypi

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi/
          skip-existing: true

  npm:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.npm != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-npm
          path: dist/npm/

      - name: Every file is byte for byte a scanned file
        run: python3 -I .github/scripts/match-scanned.py --release dist/npm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish with trusted publishing (no token)
        run: |
          set -eu
          shopt -s nullglob
          files=(dist/npm/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing new for npm"; exit 0; fi
          npm --version
          for f in "${files[@]}"; do npm publish "$f" --access public --ignore-scripts; done

  release:
    name: GitHub release with the files and SHA256SUMS
    needs: [check, pypi, npm]
    # After every publish job that ran has succeeded (a registry's job is skipped when nothing is new for it).
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: Every file to upload is byte for byte a scanned file
        run: python3 -I .github/scripts/match-scanned.py --release release

      - name: SHA256SUMS for every file, checked
        run: |
          set -eu
          ops/publish/checksums.sh release
          (cd release && sha256sum -c --strict SHA256SUMS)
          ls -l release

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          {
            echo "Files made by this release run. Check a download against SHA256SUMS:"
            echo
            echo '    sha256sum -c --ignore-missing SHA256SUMS'
            echo
            echo "Published to the package registries in the same run:"
            for f in release/*.tgz; do [ -e "$f" ] && echo "- npm: $(basename "$f")"; done
            for f in release/*.whl; do [ -e "$f" ] && echo "- PyPI: $(basename "$f")"; done
            echo
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          # Only a release that carries the command-line tool's downloads becomes "latest", so the docs' links to
          # releases/latest/download/... always find them.
          latest=false
          if compgen -G 'release/survivalservers_*' > /dev/null; then latest=true; fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"

  mcp-registry-gate:
    name: MCP Registry entry, the owner's approval and the lead's go (publishes nothing)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: The entry is the approved bytes, and whether the lead's go names it
        id: gate
        run: python3 -I .github/scripts/mcp-registry-gate.py --github-output "$GITHUB_OUTPUT"

  mcp-registry:
    name: Publish to the MCP Registry
    needs: [check, mcp-registry-gate]
    if: needs.mcp-registry-gate.outputs.go == 'true' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      contents: read
      id-token: write
    env:
      # The one mcp-publisher this job runs: its release on GitHub and the SHA-256 of its Linux x86-64 archive, as that
      # release lists it (registry_1.8.7_checksums.txt and the release's own asset digest, read 2026-11-18), and the
      # day that release came out, which the gate prints beside its go.
      MCP_PUBLISHER_VERSION: "1.8.7"
      MCP_PUBLISHER_SHA256: "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579"
      MCP_PUBLISHER_RELEASED: "2026-10-30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: The entry is still the approved bytes, with the lead's go
        run: python3 -I .github/scripts/mcp-registry-gate.py --require-go

      - name: The hosted server answers at the entry's address (its metadata, and 401 to a call with no token)
        run: |
          set -eu
          url=$(jq -r '.remotes[0].url' go/mcp/server.json)
          meta=$(curl -fsS --max-time 20 "${url%/mcp}/.well-known/oauth-protected-resource/mcp")
          [ "$(jq -r '.resource' <<<"$meta")" = "$url" ] || { echo "the metadata does not name $url"; exit 1; }
          code=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$url")
          [ "$code" = 401 ] || { echo "a call with no token answered $code, not 401"; exit 1; }
          echo "live: $url"

      - name: mcp-publisher, pinned by version and checksum
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          a="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL --max-time 60 -o "$a" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $a" | sha256sum -c --strict
          tar -xzf "$a" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" --version

      - name: Publish the entry once (a version already listed is not sent again)
        run: |
          set -eu
          pub="$RUNNER_TEMP/mcp-publisher/mcp-publisher"
          name=$(jq -r '.name' go/mcp/server.json)
          version=$(jq -r '.version' go/mcp/server.json)
          listed=$(curl -fsS --max-time 20 "https://registry.modelcontextprotocol.io/v0.1/servers?search=${name}" |
            jq -r --arg n "$name" --arg v "$version" '[.servers[]? | (.server // .) | select(.name == $n and .version == $v)] | length')
          if [ "$listed" != 0 ]; then echo "$name $version is listed already: nothing sent"; exit 0; fi
          cd go/mcp
          "$pub" validate server.json
          "$pub" login github-oidc
          python3 -I ../../.github/scripts/mcp-registry-gate.py --root ../.. --require-go
          "$pub" publish server.json
          "$pub" logout || true

      - name: Read it back
        run: |
          set -eu
          name=$(jq -r '.name' go/mcp/server.json)
          version=$(jq -r '.version' go/mcp/server.json)
          url=$(jq -r '.remotes[0].url' go/mcp/server.json)
          curl -fsS --max-time 20 "https://registry.modelcontextprotocol.io/v0.1/servers?search=${name}" |
            jq -e --arg n "$name" --arg v "$version" --arg u "$url" \
              '[.servers[]? | (.server // .) | select(.name == $n and .version == $v and .remotes[0].url == $u)] | length == 1'
