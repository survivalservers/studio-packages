# Publishes the packages in this repository and makes the GitHub release that carries the release files.
# - Runs only when a tag starting with "v" is pushed, and stops unless the tagged commit is on main.
# - Every publish job waits in the "publish" environment for a required reviewer to approve it. All of them need only
#   the check job, so they wait at the same moment and one approval covers every registry in the run.
# - No pull request runs and no manual runs.
# - No stored keys: each registry trusts this file, in this repository, in the "publish" environment.
# - A version already on a registry is skipped, so a tag only publishes what is new.
# - Nothing a package runs when installed: no install scripts, no setup.py, no build.rs. Python builds make wheels
#   only, npm packs and publishes with scripts off and the packed package.json carries no scripts at all.
# - Every action is pinned to a full commit and every build tool to a hash.
# - Nothing goes out unless it is byte for byte a file that was scanned before it went public: the check job, each
#   publish job and the release job compare every file with the scanned lists (SHA256SUMS.scanned) and refuse any
#   file that differs or is on no list. A release never rebuilds to get past that.
# - The release job runs after the publish jobs succeed, outside the environment, with no id-token and no secrets:
#   it attaches every file the run made (the command-line tool's downloads and the package files) and SHA256SUMS.
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Tag on main, no install-time code, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      npm: ${{ steps.build.outputs.npm }}
      pypi: ${{ steps.build.outputs.pypi }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Every action, nested ones included, is allowed
        run: python3 .github/scripts/check-actions.py

      - name: Build what is new (no install-time code; npm packed with no scripts; wheels only; the downloads)
        id: build
        run: .github/scripts/build.sh --release "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm
          path: dist/npm/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-first-by-hand
          path: dist/npm-first-by-hand/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pypi
          path: dist/pypi/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: dist/cli/
          if-no-files-found: ignore

  pypi:
    name: Publish to PyPI
    needs: check
    if: needs.check.outputs.pypi != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pypi
          path: dist/pypi/

      - name: Every file is byte for byte a scanned file
        run: python3 -I .github/scripts/match-scanned.py --release dist/pypi

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi/
          skip-existing: true

  npm:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.npm != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-npm
          path: dist/npm/

      - name: Every file is byte for byte a scanned file
        run: python3 -I .github/scripts/match-scanned.py --release dist/npm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish with trusted publishing (no token)
        run: |
          set -eu
          shopt -s nullglob
          files=(dist/npm/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing new for npm"; exit 0; fi
          npm --version
          for f in "${files[@]}"; do npm publish "$f" --access public --ignore-scripts; done

  release:
    name: GitHub release with the files and SHA256SUMS
    needs: [check, pypi, npm]
    # After every publish job that ran has succeeded (a registry's job is skipped when nothing is new for it).
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: Every file to upload is byte for byte a scanned file
        run: python3 -I .github/scripts/match-scanned.py --release release

      - name: SHA256SUMS for every file, checked
        run: |
          set -eu
          ops/publish/checksums.sh release
          (cd release && sha256sum -c --strict SHA256SUMS)
          ls -l release

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          {
            echo "Files made by this release run. Check a download against SHA256SUMS:"
            echo
            echo '    sha256sum -c --ignore-missing SHA256SUMS'
            echo
            echo "Published to the package registries in the same run:"
            for f in release/*.tgz; do [ -e "$f" ] && echo "- npm: $(basename "$f")"; done
            for f in release/*.whl; do [ -e "$f" ] && echo "- PyPI: $(basename "$f")"; done
            echo
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
