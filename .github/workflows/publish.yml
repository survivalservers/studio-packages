# Publishes the packages in this repository and makes the GitHub release that carries the release files.
# - Runs only when a tag starting with "v" is pushed, and stops unless the tagged commit is on main.
# - Every publish job waits in the "publish" environment for a required reviewer to approve it. All of them need only
#   the check job, so they wait at the same moment and one approval covers every registry in the run.
# - No pull request runs and no manual runs.
# - No stored keys: each registry trusts this file, in this repository, in the "publish" environment.
# - A version already on a registry is skipped, so a tag only publishes what is new.
# - Nothing a package runs when installed: no install scripts, no setup.py, no build.rs. Python builds make wheels
#   only, npm packs and publishes with scripts off and the packed package.json carries no scripts at all.
# - Every action is pinned to a full commit and every build tool to a hash.
# - The release job runs after the publish jobs succeed, outside the environment, with no id-token and no secrets:
#   it attaches every file the run made (the command-line tool's downloads and the package files) and SHA256SUMS.
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Tag on main, no install-time code, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      npm: ${{ steps.npmpack.outputs.count }}
      pypi: ${{ steps.pybuild.outputs.count }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Every action, nested ones included, is allowed
        run: python3 .github/scripts/check-actions.py

      - name: No install-time code in any package
        run: |
          set -eu
          bad=$(git ls-files | grep -E '(^|/)(setup\.py|setup\.cfg|build\.rs|binding\.gyp|install\.ps1)$|\.(targets|props)$' || true)
          if [ -n "$bad" ]; then echo "Not allowed in this repository: $bad"; exit 1; fi
          # npm runs these when a package is installed (prepare also for git and folder installs): never allowed.
          for f in npm/*/package.json; do
            node -e '
              const p = require("./" + process.argv[1]);
              const banned = ["preinstall", "install", "postinstall", "prepare", "preprepare", "postprepare", "prepublish"];
              const found = Object.keys(p.scripts || {}).filter(s => banned.includes(s));
              if (found.length) { console.log(process.argv[1] + " has install-time scripts: " + found.join(", ")); process.exit(1); }
            ' "$f"
          done

      - name: Pack the npm packages that are not on npm yet (no scripts run, none packed)
        id: npmpack
        run: |
          set -eu
          mkdir -p dist/npm dist/npm-first-by-hand
          for d in npm/*/; do
            d=${d%/}
            name=$(node -p 'require("./'"$d"'/package.json").name')
            version=$(node -p 'require("./'"$d"'/package.json").version')
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already on npm; skipped"; continue; fi
            # Trusted publishing can only be set on a package that already exists, so a new name is published the
            # first time by hand (from this run's file) and is never part of this run's npm job.
            out=dist/npm
            if ! npm view "$name" name >/dev/null 2>&1; then echo "$name is a new name on npm: packed for a first publish by hand"; out=dist/npm-first-by-hand; fi
            work=$(mktemp -d)
            cp -R "$d/." "$work/"
            if [ -f "$work/tsconfig.json" ]; then
              (cd "$work" && npm ci --ignore-scripts --no-audit --no-fund && ./node_modules/.bin/tsc -p tsconfig.json)
            fi
            # The published package.json carries no scripts and no development packages.
            (cd "$work" && npm pkg delete scripts devDependencies && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/$out")
            rm -rf "$work"
          done
          for t in dist/npm/*.tgz dist/npm-first-by-hand/*.tgz; do
            [ -e "$t" ] || continue
            tar -xzOf "$t" package/package.json | node -e '
              let s = ""; process.stdin.on("data", c => s += c).on("end", () => {
                const p = JSON.parse(s);
                if (p.scripts && Object.keys(p.scripts).length) { console.log(process.argv[1] + ": packed with scripts"); process.exit(1); }
                if (p.gypfile) { console.log(process.argv[1] + ": gypfile set"); process.exit(1); }
              });' "$t"
            if tar -tzf "$t" | grep -qE '(^|/)binding\.gyp$'; then echo "$t: binding.gyp packed"; exit 1; fi
            echo "$t:"; tar -tzf "$t" | sed 's/^/  /'
          done
          echo "count=$(find dist/npm -name '*.tgz' | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm
          path: dist/npm/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-first-by-hand
          path: dist/npm-first-by-hand/
          if-no-files-found: ignore

      - name: Build the Python packages that are not on PyPI yet (wheels only, build tools pinned by hash)
        id: pybuild
        run: |
          set -eu
          cat > "$RUNNER_TEMP/build-requirements.txt" <<'REQ'
          build==1.6.1 --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject_hooks==1.3.3 --hash=sha256:5fc53fdac9f7bd63fbcdc868fb5f90b4784d78a53a3d3388cd738b807441a20b
          flit_core==4.2.0 --hash=sha256:2bee22dc8ba89c2e35b4e1ad575e596aac945c85672dd8f3cad21b629036e044
          uv_build==0.12.24 --hash=sha256:57025a08ad963c5f3f0a573d848a39b6adf9d6095b47b87abbad68af07e9699e
          REQ
          python3 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/build-requirements.txt"
          mkdir -p dist/pypi
          for d in pypi/*/; do
            spec=$(python3 -c 'import sys, tomllib; p = tomllib.load(open(sys.argv[1], "rb"))["project"]; print(p["name"] + "/" + p["version"])' "$d/pyproject.toml")
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$spec/json")
            if [ "$code" = 200 ]; then echo "$spec is already on PyPI; skipped"; continue; fi
            if [ "$code" != 404 ]; then echo "PyPI answered $code for $spec; stopping"; exit 1; fi
            # uv_build's backend finds its own program on PATH, so the build tools' folder goes first.
            PATH="$RUNNER_TEMP/build/bin:$PATH" "$RUNNER_TEMP/build/bin/python" -m build --wheel --no-isolation --outdir dist/pypi "$d"
          done
          echo "count=$(find dist/pypi -name '*.whl' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Install each wheel and import it (wheels only, nothing built at install)
        run: |
          set -eu
          for w in dist/pypi/*.whl; do
            [ -e "$w" ] || continue
            python3 -m venv "$RUNNER_TEMP/try"
            "$RUNNER_TEMP/try/bin/pip" install --quiet --only-binary=:all: "$w"
            mods=$(python3 -c 'import sys, zipfile; print(" ".join(sorted({n.split("/")[0] for n in zipfile.ZipFile(sys.argv[1]).namelist() if "/" in n and not n.split("/")[0].endswith((".dist-info", ".data"))})))' "$w")
            for m in $mods; do "$RUNNER_TEMP/try/bin/python" -c "import $m; print('imported', '$m')"; done
            rm -rf "$RUNNER_TEMP/try"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pypi
          path: dist/pypi/
          if-no-files-found: ignore

      - name: Build the command-line tool's downloads (when its source is here)
        run: |
          set -eu
          mkdir -p dist/cli
          if [ ! -x go/cli/release.sh ]; then echo "no command-line tool in this repository yet; nothing to build"; exit 0; fi
          version=${GITHUB_REF_NAME#v}
          go version
          (cd go/cli && ./release.sh "$version")
          # The release job writes one SHA256SUMS for every file in the release, so the tool's own is not carried.
          find go/cli/dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/cli/ \;
          ls -l dist/cli

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: dist/cli/
          if-no-files-found: ignore

  pypi:
    name: Publish to PyPI
    needs: check
    if: needs.check.outputs.pypi != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pypi
          path: dist/pypi/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi/
          skip-existing: true

  npm:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.npm != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-npm
          path: dist/npm/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish with trusted publishing (no token)
        run: |
          set -eu
          shopt -s nullglob
          files=(dist/npm/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing new for npm"; exit 0; fi
          npm --version
          for f in "${files[@]}"; do npm publish "$f" --access public --ignore-scripts; done

  release:
    name: GitHub release with the files and SHA256SUMS
    needs: [check, pypi, npm]
    # After every publish job that ran has succeeded (a registry's job is skipped when nothing is new for it).
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: SHA256SUMS for every file, checked
        run: |
          set -eu
          ops/publish/checksums.sh release
          (cd release && sha256sum -c --strict SHA256SUMS)
          ls -l release

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          {
            echo "Files made by this release run. Check a download against SHA256SUMS:"
            echo
            echo '    sha256sum -c --ignore-missing SHA256SUMS'
            echo
            echo "Published to the package registries in the same run:"
            for f in release/*.tgz; do [ -e "$f" ] && echo "- npm: $(basename "$f")"; done
            for f in release/*.whl; do [ -e "$f" ] && echo "- PyPI: $(basename "$f")"; done
            echo
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
