# Builds every package and the command-line tool's downloads on each pull request and on main, the same way a release
# run does (.github/scripts/build.sh), so a release never meets a build problem for the first time. It publishes
# nothing: no environment, no id-token, read-only token.
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Every package and download builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build (publishes nothing)
        run: |
          set -eu
          # The command-line tool is built at the version its scanned list names, so this check shows whether the
          # build still gives the scanned files; with no list yet, a placeholder version.
          version=0.0.0-check
          if [ -f go/cli/SHA256SUMS.scanned ]; then
            v=$(sed -n 's/^[0-9a-f]\{64\}  survivalservers_\([^_]*\)_linux_amd64\.tar\.gz$/\1/p' go/cli/SHA256SUMS.scanned | head -n1)
            version=${v:-$version}
          fi
          .github/scripts/build.sh --check "$version"

      - name: SHA256SUMS over everything built, checked
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release"
          find dist -type f -exec cp {} "$RUNNER_TEMP/release/" \;
          ops/publish/checksums.sh "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum -c --strict SHA256SUMS)
