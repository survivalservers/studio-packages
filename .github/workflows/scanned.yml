# A pull request that changes a scanned list (any SHA256SUMS.scanned) or the SOURCE_DATE_EPOCH file must carry
# Survival Servers Security's OK for that exact content in its description (check-scanned-ok.py). It also runs the
# tests of the check that compares release files with those lists. Runs again when the description is edited.
name: scanned

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  scanned:
    name: Scanned lists change only with Security's OK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: The release-file check's own tests
        run: python3 -I .github/scripts/match-scanned_test.py

      - name: Every changed scanned list carries Security's OK
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I .github/scripts/check-scanned-ok.py
